syntax = "proto3";
package access.v1;

import "cosmos_proto/cosmos.proto";

option go_package = "github.com/nodelabs-sdk/nodelabs/x/access/types";

// Grant is a single (grantee, action, scope) entry — the flat form stored in
// state and served by queries and genesis. The action vocabulary is static
// configuration of the module that owns the grant; scope is an opaque resource
// identifier owned by that module (e.g. a license type id) and is empty for
// modules that do not scope their actions.
//
// There is no module field: a grant lives in the store of the module that
// governs it, so the store is the boundary.
message Grant {
  string grantee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string action = 2;
  string scope = 3;
}

// ActionScopes is one entry within a grant message: a single action applied to
// a set of scopes. An empty scopes list is the module-wide grant form.
message ActionScopes {
  string action = 1;
  repeated string scopes = 2;
}

// ActionScope identifies a single (action, scope) pair to revoke. An empty
// scope targets the module-wide grant.
message ActionScope {
  string action = 1;
  string scope = 2;
}
