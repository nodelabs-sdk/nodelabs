name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Callable from other workflows so the release build can gate on the same
  # checks without duplicating them.
  workflow_call:

# A newer push to a PR supersedes an in-flight run. Never cancel on main or
# during a release build, where the result is the gate rather than feedback.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with MODULES in the Makefile.
  MODULES: api access x/license x/license/precompile x/network .

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.8'
        cache: true
        cache-dependency-path: '**/go.sum'

    # The repository is several Go modules (api, access, x/license, x/license/precompile, x/network
    # and the root app). The go tool stops at module boundaries, so each step
    # visits every module rather than relying on ./... from the root.
    - name: Download dependencies
      run: |
        for m in $MODULES; do (cd "$m" && go mod download) || exit 1; done

    - name: Build
      run: |
        for m in $MODULES; do (cd "$m" && go build ./...) || exit 1; done

    - name: Check go.mod files are tidy
      run: |
        make tidy
        git diff --exit-code -- '*go.mod' '*go.sum'

    - name: Check formatting
      run: |
        # Scoped to hand-written packages; api/ is generated and formatted by
        # the protoc plugins.
        unformatted=$(gofmt -l app cmd access x)
        if [ -n "$unformatted" ]; then
          echo "::error::These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      # Skips the api module so a future proto regeneration emitting
      # vet-unclean generated code cannot break CI on a non-issue.
      run: |
        for m in $MODULES; do
          [ "$m" = api ] && continue
          (cd "$m" && go vet ./...) || exit 1
        done

    - name: Test
      # make test runs go test -race ./... in every module, so CI and local
      # runs stay identical.
      run: make test
